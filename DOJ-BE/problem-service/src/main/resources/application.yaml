# ═══════════════════════════════════════════════════════════════
# Problem Service — 本地开发配置
# ═══════════════════════════════════════════════════════════════
# K8s 部署时：DB 和 ES 配置从 Nacos 拉取
# ═══════════════════════════════════════════════════════════════

server:
  port: ${doj.port.problem-service}

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  metrics:
    export:
      prometheus:
        enabled: true

# ─── 数据库库名（K8s 与本地共用）───────────────────────────
# Nacos shared-jdbc.yaml 的 ${doj.db.name} 引用此值
doj:
  db:
    name: doj_problem

