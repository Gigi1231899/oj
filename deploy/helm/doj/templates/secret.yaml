{{/*
  ═══════════════════════════════════════════════════════════════
  D-OnlineJudge — 密文配置 (Secret)
  ═══════════════════════════════════════════════════════════════
  ⚠️ 生产部署前务必修改以下密码！！！
  ⚠️ 生产部署前务必修改以下密码！！！
  ⚠️ 生产部署前务必修改以下密码！！！
  
  部署方式：
    1. 修改此文件中的密码
    2. 通过 values.yaml 传入覆盖：
       helm install doj . --set secret.mysqlRootPassword=<强密码> ...
    3. 更好的方式：使用外部 Secret 管理工具（Azure Key Vault / HashiCorp Vault）
  ═══════════════════════════════════════════════════════════════
*/}}

apiVersion: v1
kind: Secret
metadata:
  name: doj-secrets
  namespace: {{ .Release.Namespace }}
type: Opaque      {{/* Opaque：自定义键值对，K8s 不做特殊处理 */}}
stringData:
  # ─── MySQL ────────────────────────────────────────────────
  # ⚠️ 默认密码不安全，生产环境必须更换
  # MySQL 初始化时 root 密码即此值
  mysql-root-password: "123"

  # ─── RabbitMQ ─────────────────────────────────────────────
  # RabbitMQ 默认 guest 密码
  rabbitmq-password: "guest"


  
  # Erlang Cookie：集群内所有节点必须一致
  # 用于 Erlang 节点间认证，不同 cookie 会导致集群加入失败
  # ⚠️ 生产环境建议改为随机字符串
  rabbitmq-erlang-cookie: "doj-erlang-secret-cookie"

  # ─── Nacos ────────────────────────────────────────────────
  # Nacos 鉴权 Token（identity.key + identity.value）
  # ⚠️ 长度至少 32 字符，建议改为随机值
  # nacos-auth-token: "doj-nacos-auth-token-default-change-me"

  # ─── Agent AI 评测 ────────────────────────────────────────
  # DeepSeek API Key：Agent 调用 AI 进行代码评测
  # ⚠️ 部署时必须替换为真实 Key
  deepseek-api-key: "sk-5c2806b645924e6a95e31d3dafe46aa3"
